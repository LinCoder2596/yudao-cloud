# version: "3.8"
services:
  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: nacos-standalone-mysql
    env_file:
      - env/nacos-standalone-mysql.env
    volumes:
      - ./logs/nacos/:/home/nacos/logs
    ports:
      - "8080:8080"
      - "8848:8848"
      - "9848:9848"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dev-network
    restart: no
  
  mysql:
    container_name: mysql
    image: mysql:8.4.8
    env_file:
      - env/mysql.env
    volumes:
      - ./mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d/
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost" ]
      interval: 5s
      timeout: 10s
      retries: 10
    networks:
      - dev-network
    restart: no
  
  redis:
    image: redis:8.2.3
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis:/data
    command:
      --appendonly yes
    networks:
      - dev-network
    restart: no
networks:
  dev-network:
    driver: bridge
